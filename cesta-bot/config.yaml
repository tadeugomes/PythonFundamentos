benchmark: "^BVSP"

strategy:
  n_positions: 8            # tamanho da cesta
  momentum_lookback: 252    # 12 meses em pregões
  momentum_skip: 21         # ignora o último mês (reversão de curto prazo)
  trend_sma: 50             # só entra acima da média de 50 dias
  trailing_stop: 0.12       # sai se cair 12% do pico desde a entrada
  min_hold_weeks: 2         # evita giro excessivo
  regime_sma: 200           # IBOV abaixo da SMA200 => reduz exposição
  regime_exposure: 0.5      # fração investida em regime desfavorável
  vol_lookback: 63          # usado no filtro de volatilidade
  max_vol_annual: 0.60      # exclui ativos acima de 60% de vol anualizada

costs:
  commission: 0.0           # XP: corretagem zero em ações via plataforma
  b3_fees: 0.0003           # emolumentos + liquidação aproximados
  slippage: 0.001           # 0,1% por lado

backtest:
  start: "2015-01-01"
  initial_capital: 100000
  cdi_annual: 0.11          # usado só como referência fixa se a série do BCB falhar

execution:
  mode: "paper"             # paper | telegram | mt5
  capital_per_position: 500 # R$ por ativo durante o teste
  use_fractional: true      # usa mercado fracionário (sufixo F) para valores pequenos
  state_file: "state/portfolio.json"
  dry_run: true             # com mt5: só simula o envio de ordens

telegram:
  token_env: "TELEGRAM_TOKEN"
  chat_id_env: "TELEGRAM_CHAT_ID"

mt5:
  login_env: "MT5_LOGIN"
  password_env: "MT5_PASSWORD"
  server: "XPMT5-PRD"       # conta demo: XPMT5-DEMO
  terminal_path: "C:/Program Files/MetaTrader 5/terminal64.exe"
