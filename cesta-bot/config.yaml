benchmark: "^BVSP"

strategy:
  n_positions: 8            # tamanho da cesta
  momentum_lookback: 252    # 12 meses em pregões
  momentum_skip: 21         # ignora o último mês (reversão de curto prazo)
  trend_sma: 50             # só entra acima da média de 50 dias
  exit_sma: 50              # sai abaixo desta média (100, 150, 200 testadas: sem ganho fora da amostra)
  exit_confirm_days: 1      # pregões seguidos abaixo da média de saída antes de vender
  trailing_stop: 0.12       # sai se cair 12% do pico desde a entrada
  min_hold_weeks: 2         # evita giro excessivo
  regime_sma: 200           # IBOV abaixo da SMA200 => reduz exposição
  regime_exposure: 0.5      # fração investida em regime desfavorável (1.0 desliga o filtro)
  regime_confirm_weeks: 1   # semanas seguidas do outro lado da SMA200 para trocar o regime
  size_top: 0               # >0: ranking só entre as K mais negociadas (volume financeiro de 252 pregões)
  weighting: "equal"        # equal (1/n) | liquidity (peso pelo volume financeiro)
  max_weight: 0.25          # teto por ativo com weighting: liquidity
  vol_lookback: 63          # usado no filtro de volatilidade
  max_vol_annual: 0.60      # exclui ativos acima de 60% de vol anualizada
  resize_on_regime: true    # na troca de regime, reduz/recompõe as posições já abertas
  check: "weekly"           # saídas (stop, SMA): weekly | daily
  refill: "weekly"          # reposição de vagas abertas: weekly | daily
  stop_type: "close"        # close | intraday (stop no pregão; só no backtest, sem ganho no teste)

costs:
  commission: 0.0           # XP: corretagem zero em ações via plataforma
  b3_fees: 0.0003           # emolumentos + liquidação aproximados
  slippage: 0.001           # 0,1% por lado

backtest:
  start: "5y"               # últimos 5 anos; aceita data fixa, ex. "2015-01-01"
  initial_capital: 100000
  cdi_annual: 0.11          # usado só como referência fixa se a série do BCB falhar
  execution: "next_open"    # next_open (como ao vivo) | close (mesmo fechamento do sinal)
  cash_yield: true          # caixa parado rende CDI

execution:
  mode: "paper"             # paper | telegram | mt5
  capital_per_position: 500 # R$ por ativo durante o teste
  use_fractional: true      # usa mercado fracionário (sufixo F) para valores pequenos
  state_file: "state/portfolio.json"
  dry_run: true             # com mt5: só simula o envio de ordens

telegram:
  token_env: "TELEGRAM_TOKEN"
  chat_id_env: "TELEGRAM_CHAT_ID"

mt5:
  login_env: "MT5_LOGIN"
  password_env: "MT5_PASSWORD"
  server: "XPMT5-PRD"       # conta demo: XPMT5-DEMO
  terminal_path: "C:/Program Files/MetaTrader 5/terminal64.exe"
